[tool.poetry]
name = "bubble_analyser"
version = "2.0.0"
description = "[Description for project.]"
authors = [
    "Dr Diego Mesa <d.mesa@ic.ac.uk>",
    "Mr Yiyang Guan",
    "Mr Bastian Valdivia-Muñoz <bastian.valdivia.m@gmail.com>"
]

[tool.poetry.dependencies]
python = ">=3.11, <3.13"
opencv-python = "^4.10.0"
matplotlib = "^3.10.7"
toml = "^0.10.2"
numpy = "1.26.4"
scikit-image = "^0.25.2"
scipy = "^1.15.3"
pydantic = "^2.12.3"
typing-extensions = "^4.15.0"
pyside6 = "^6.10.0"
mkdocstrings-python = ">=0.18"
pandas = ">=2.3.3,<4.0.0"
openpyxl = "^3.1.5"
h5py = "^3.15.1"
tensorflow = "^2.20.0"
ipython = ">=8.37,<10.0"

imgaug = "^0.4.0"
requests = "^2.32.5"
tqdm = "^4.67.3"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.11"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2,<10.0.0"
pytest-cov = "^6.0.0"
pytest-mypy = "^1.0.0"
pytest-mock = "^3.7.0"
pre-commit = "^4.2.0"
ruff = "^0.11.2"
types-toml = "^0.10.8.20240310"
types-requests = "^2.32.0.20241016"
types-tqdm = "^4.66.0.20240417"
pyinstaller = "^6.16.0"
pytest-qt = "^4.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = true
disallow_any_explicit = false
disallow_any_generics = false
warn_unreachable = false
warn_unused_ignores = false
disallow_untyped_defs = true
exclude = [".venv/", "dist/", "build/", "internal_optimization/", "tools/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "bubble_analyser.mrcnn.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "requests",
    "tqdm"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --mypy -p no:warnings --cov=bubble_analyser --cov-report=html --ignore=bubble_analyser/__main__.py --ignore=bubble_analyser/mrcnn/ --ignore=examples/ --ignore=tools/ --ignore=tests/test_on_methods.py --ignore=tests/profile_bubmask.py --ignore=tests/test_parallel_implementation.py"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "RUF"  # ruff
]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", # Missing docstrings
    "E402", # Module level import not at top of file
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D104"] # Missing docstring in public module, Missing docstring in public package
